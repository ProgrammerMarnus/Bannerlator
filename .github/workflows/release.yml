name: Nightly Manual Release Build

# STABLE builds — builds via the reusable _build.yml (same matrix build as the
# artifacts-only workflow), then a second job downloads the flavor artifacts and
# publishes the GitHub release + update.json. A release is ONLY produced here.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (optional)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag (e.g. 1.7, 1.8)'
        required: true
        default: '1.0'
      release_title:
        description: 'Release title (e.g. Bannerlator 1.0)'
        required: true
        default: 'Bannerlator 1.0'
      release_number:
        description: 'Release number for APK name (e.g. 1.7, 1.9-pre1)'
        required: true
        default: '1.0'
      make_prerelease:
        description: 'Pre-release? (true = beta build, not offered to stable users)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  # Phase 1 — build all 3 flavors in parallel (reusable matrix build).
  build:
    uses: ./.github/workflows/_build.yml
    with:
      release_number: ${{ inputs.release_number }}

  # Phase 2 — collect the built APKs and publish the release + update.json.
  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 20        # for the git-log changelog; no submodules/assets needed here

    - name: Download built APKs
      uses: actions/download-artifact@v4
      with:
        pattern: Bannerlator-${{ inputs.release_number }}-*
        path: dist
        merge-multiple: true   # all 3 flavor APKs land flat in dist/

    - name: List downloaded APKs
      run: ls -la dist/

    - name: Get version info
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "VERSION=$(grep versionName app/build.gradle | head -1 | cut -d '"' -f 2)" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

    - name: Verify versionCode was bumped
      # Phase-5 gate: versionCode lives hardcoded in app/build.gradle and UpdateManager only offers
      # an update when update.json's versionCode > the INSTALLED BuildConfig.VERSION_CODE — both
      # derive from that one literal. Forgetting the bump ships a release NO installed user is ever
      # offered (silent no-op). Compare against the last published update.json; hard-fail STABLE
      # cuts that didn't move. Pre-releases never touch update.json (make_latest=false), so they
      # only warn. First-ever release (no previous asset) skips. Fetch failures warn-and-skip
      # rather than blocking a deliberate manual release on a transient API hiccup.
      env:
        GH_TOKEN: ${{ github.token }}
        MAKE_LATEST: ${{ inputs.make_prerelease }}
        RELEASE_NUM: ${{ inputs.release_number }}
      run: |
        if [ "$VERSION" != "$RELEASE_NUM" ]; then
          echo "::warning::release_number ('$RELEASE_NUM') differs from manifest versionName ('$VERSION') — cosmetic, but keep naming intentional."
        fi
        PREV_DIR=$(mktemp -d)
        # Recompute here: the later update.json step defines its own VERSION_CODE; this gate must
        # not depend on step ordering.
        VERSION_CODE=$(grep versionCode app/build.gradle | head -1 | grep -oE '[0-9]+' | head -1)
        if [ -z "$VERSION_CODE" ]; then
          echo "::error::Could not parse versionCode from app/build.gradle."
          exit 1
        fi
        if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'update.json' --dir "$PREV_DIR" 2>/dev/null && [ -s "$PREV_DIR/update.json" ]; then
          PREV_VC=$(jq -r '.versionCode // 0' "$PREV_DIR/update.json")
          if [ "$MAKE_LATEST" != "true" ]; then
            echo "Pre-release cut (update.json left pointing at last stable): prev stable versionCode=$PREV_VC, building $VERSION_CODE"
            if [ "$VERSION_CODE" -le "$PREV_VC" ]; then
              echo "::warning::pre-release versionCode ($VERSION_CODE) is not above the last stable ($PREV_VC). Remember to bump before promoting to stable."
            fi
          elif [ "$VERSION_CODE" -le "$PREV_VC" ]; then
            echo "::error::versionCode NOT bumped: this build=$VERSION_CODE, latest published release=$PREV_VC."
            echo "::error::UpdateManager offers nothing when update.json versionCode <= installed versionCode, so this stable release would be invisible to users."
            echo "::error::Bump 'versionCode NNN' in app/build.gradle and re-run this workflow."
            exit 1
          else
            echo "OK: versionCode $PREV_VC -> $VERSION_CODE"
          fi
        else
          echo "::warning::No previous update.json found — versionCode-bump check skipped (first release?)."
        fi

    - name: Generate update.json
      # Drives the in-app updater (UpdateManager). The app fetches this from
      # releases/latest/download/update.json; because make_latest=true +
      # prerelease=false below, only stable cuts ever change it.
      # release_notes/title arrive via env (NOT inline ${{ }}) so backticks / $ /
      # newlines in the notes can't trigger shell command-substitution (exit 127).
      env:
        RELEASE_NOTES: ${{ inputs.release_notes }}
        RELEASE_TITLE: ${{ inputs.release_title }}
      run: |
        VERSION_CODE=$(grep versionCode app/build.gradle | head -1 | grep -oE '[0-9]+' | head -1)
        N="${{ inputs.release_number }}"
        NOTES="$RELEASE_NOTES"
        [ -z "$NOTES" ] && NOTES="$RELEASE_TITLE"
        jq -n \
          --argjson vc "$VERSION_CODE" \
          --arg vn "$VERSION" \
          --arg notes "$NOTES" \
          --arg std "Bannerlator-${N}-standard.apk" \
          --arg lud "Bannerlator-${N}-ludashi.apk" \
          --arg pbg "Bannerlator-${N}-pubg.apk" \
          '{versionCode:$vc, versionName:$vn, notes:$notes, minSupported:1,
            apk:{"com.winlator.banner":$std,"com.ludashi.benchmark":$lud,"com.tencent.ig":$pbg}}' \
          > update.json
        echo "Generated update.json:"; cat update.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        name: ${{ inputs.release_title }}
        # Body is EXACTLY the supplied release_notes — which already opens with the
        # centered logo + badges. Do NOT prepend a second logo or a `git log`
        # changelog table: that produced a duplicate logo + a raw commit listing
        # stacked above the real notes at the top of every release.
        body: ${{ inputs.release_notes }}
        files: |
          dist/Bannerlator-${{ inputs.release_number }}-standard.apk
          dist/Bannerlator-${{ inputs.release_number }}-ludashi.apk
          dist/Bannerlator-${{ inputs.release_number }}-pubg.apk
          update.json
        prerelease: ${{ inputs.make_prerelease == 'true' }}
        # Only a stable cut becomes "latest"; pre-releases never do, so the
        # default (toggle-off) updater keeps pointing at the last stable.
        make_latest: ${{ inputs.make_prerelease != 'true' }}
